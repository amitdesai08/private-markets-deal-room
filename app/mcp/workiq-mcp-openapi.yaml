# Work IQ MCP — OpenAPI (Swagger 2.0) TEMPLATE for a Copilot Studio custom connector.
# Replace the <PLACEHOLDERS> below with your own deployment values before importing:
#   <MCP_HOST>         the Container App FQDN (no scheme) hosting /workiq-mcp
#   <ENTRA_TENANT_ID>  your Entra tenant GUID
#   <MCP_CLIENT_ID>    the app registration (client) ID for the deal MCP server
# See mcp/README-workiq-copilot-studio.md for the full walkthrough.
swagger: '2.0'
info:
  title: Deal Room — Work IQ MCP
  description: >-
    Streamable MCP server exposing the fund's Microsoft 365 work data
    (search_files, search, search_mail, read_channel_messages) to Copilot Studio
    and Microsoft 365 Copilot, so an agent can ground answers in the deal team's
    real SharePoint/OneDrive documents, Teams channel discussions and Outlook
    mail. Backed directly by Microsoft Graph (app-only, read-only); access to the
    endpoint is gated by Entra ID or a static read-only key.
  version: 1.0.0
host: <MCP_HOST>
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /workiq-mcp:
    post:
      summary: Deal Room Work IQ MCP server
      description: >-
        Streamable HTTP MCP endpoint. Tools: search_files (SharePoint/OneDrive
        documents), search (files + list items + sites), search_mail (a target
        mailbox), read_channel_messages (a specific Teams channel). Read-only.
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeWorkIqMCP
      responses:
        '200':
          description: Success
securityDefinitions:
  # OAuth 2.0 (Microsoft Entra ID) — same app + scope as the deal MCP. In Copilot
  # Studio's MCP wizard choose OAuth 2.0 -> Manual and supply the values in
  # mcp/README-copilot-studio.md. A static read-only key (header x-mcp-key) is also
  # accepted for machine agents.
  oauth2_auth:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://login.microsoftonline.com/<ENTRA_TENANT_ID>/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/<ENTRA_TENANT_ID>/oauth2/v2.0/token
    scopes:
      api://<MCP_CLIENT_ID>/deals.read: Read the fund's work data
security:
  - oauth2_auth:
      - api://<MCP_CLIENT_ID>/deals.read
