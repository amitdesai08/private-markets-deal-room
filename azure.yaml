# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: deal-room
metadata:
    template: deal-room-teams@1.0.0
services:
    orchestrator:
        project: ./app
        host: containerapp
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
    teams:
        project: ./teams-app
        host: containerapp
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
infra:
    provider: microsoft.foundry
    module: main
hooks:
    postdeploy:
        windows:
            shell: pwsh
            run: ./scripts/azd-postdeploy.ps1
            continueOnError: true
            interactive: true
        posix:
            shell: sh
            run: ./scripts/azd-postdeploy.sh
            continueOnError: true
            interactive: true
    postprovision:
        windows:
            shell: pwsh
            run: ./scripts/azd-postprovision.ps1
            interactive: true
        posix:
            shell: sh
            run: ./scripts/azd-postprovision.sh
            interactive: true
